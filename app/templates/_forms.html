{% macro field(input, autocomplete='off') %}
<div class="field">
  {{ input.label }}
  {{ input(autocomplete=autocomplete, aria_describedby=input.id ~ '-errors' if input.errors else none) }}
  {% if input.errors %}<ul id="{{ input.id }}-errors" class="field-errors">{% for error in input.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
{% endmacro %}
